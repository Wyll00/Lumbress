# nginx para Lumbres — sustituir DOMINIO por el dominio real.
# Copiar a /etc/nginx/sites-available/lumbres y enlazar en sites-enabled.
# certbot --nginx añadirá luego el bloque SSL automáticamente.
#
# ⚠️ ESTE ARCHIVO NO SE DESPLIEGA SOLO. `deploy/subir.sh` sube la app (código +
#    dist) y reinicia pm2, pero NO toca nginx. Si cambias algo aquí hay que
#    copiarlo a mano al servidor y recargar:
#
#      scp deploy/nginx-lumbres.conf lumbres:/tmp/n.conf
#      ssh lumbres "cp /etc/nginx/sites-available/lumbres /root/lumbres-nginx-backup-\$(date +%F-%H%M).conf \
#                   && cp /tmp/n.conf /etc/nginx/sites-available/lumbres \
#                   && nginx -t && systemctl reload nginx"
#
#    (Ojo: en el servidor este archivo lleva además los bloques "managed by
#    Certbot" del HTTPS. No los pises: edita allí solo lo que necesites, o
#    fusiona a mano como se hizo el 2026-09-08.)
#
#    Historia: las cabeceras de seguridad se escribieron en junio de 2026 pero
#    nunca se copiaron al servidor; una auditoría externa (2026-09-08) detectó
#    que el HTML iba sin ellas. Aplicadas ese mismo día.

server {
    listen 80;
    server_name DOMINIO www.DOMINIO;

    # No anunciar la versión de nginx
    server_tokens off;

    # Frontend compilado (npm run build -> dist/)
    root /var/www/lumbres/dist;
    index index.html;

    # SPA: cualquier ruta no-archivo cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;

        # ── Cabeceras de seguridad del HTML ──────────────────────────────────
        # Van DENTRO del location, no a nivel de server: así /api/ y /uploads/
        # conservan solo las suyas (las pone helmet en Express) y no salen
        # duplicadas ni en conflicto (p. ej. dos Referrer-Policy distintos).
        #  - X-Frame-Options: nadie puede embeber la web en un iframe (clickjacking)
        #  - nosniff: el navegador respeta el Content-Type, no "adivina" tipos
        #  - Referrer-Policy: no filtra la URL completa a terceros
        #  - HSTS: obliga a HTTPS durante un año
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Content-Security-Policy ──────────────────────────────────────────
        # PASO 1 (esto): modo SOLO-REPORTE. NO bloquea nada; solo registra en la
        # consola del navegador lo que incumpliría la política. Hay que probar en
        # producción los flujos clave (lector PDF/EPUB, catálogo/portadas, noticias
        # con imágenes, fuentes) y comprobar que la consola NO muestra avisos
        # "[Report Only] Refused to load…".
        # PASO 2 (si no hubo avisos): quitar el sufijo -Report-Only para que
        # bloquee de verdad.
        #
        # Lista blanca (por qué cada cosa):
        #  - script 'self': el bundle es propio (three.js incluido); sin JS externo.
        #  - style 'unsafe-inline': React usa estilos en línea (style={{…}}) por todas partes.
        #  - fonts.googleapis (style) + fonts.gstatic (font): tipografías Inter/Fraunces.
        #  - img https: + data: + blob:: portadas (Gutenberg/OpenLibrary) y fotos de
        #    noticias vienen de dominios variados; las imágenes no ejecutan código.
        #  - connect 'self': diccionario, direcciones, Open Library y Gutendex se
        #    consultan desde el backend (/api/…), no desde el navegador.
        #  - worker/media blob:: el lector EPUB/PDF y el reproductor usan workers y blobs.
        #  - frame-src blob:: epub.js monta el libro en un iframe propio.
        #  - Stripe: cuando se active, añadir js.stripe.com a script-src y frame-src,
        #    y api.stripe.com a connect-src.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Cache larga para assets con hash en el nombre.
    # OJO nginx: un location con add_header propio NO hereda los del padre,
    # así que las cabeceras se repiten aquí a propósito.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # API -> backend Node en :5001
    # Las cabeceras de seguridad las pone helmet en Express; no se añaden aquí
    # para no duplicarlas.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (portadas, audio, EPUB/PDF) -> backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
    }

    # Subidas grandes (multer admite hasta 500 MB para audio de podcasts)
    client_max_body_size 600m;
}
