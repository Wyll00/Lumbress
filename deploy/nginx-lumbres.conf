# nginx para Lumbres — sustituir DOMINIO por el dominio real.
# Copiar a /etc/nginx/sites-available/lumbres y enlazar en sites-enabled.
# certbot --nginx añadirá luego el bloque SSL automáticamente.

server {
    listen 80;
    server_name DOMINIO www.DOMINIO;

    # Frontend compilado (npm run build -> dist/)
    root /var/www/lumbres/dist;
    index index.html;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    # Se aplican a la respuesta del HTML (location /). No rompen nada.
    #  - X-Frame-Options / frame-ancestors: nadie puede embeber la web en un iframe
    #    (anti-clickjacking).
    #  - nosniff: el navegador respeta el Content-Type, no "adivina" tipos.
    #  - Referrer-Policy: no filtra la URL completa a sitios de terceros.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Content-Security-Policy ──────────────────────────────────────────────
    # PASO 1 (esto): modo SOLO-REPORTE. NO bloquea nada; solo registra en la consola
    # del navegador lo que incumpliría la política. Hay que probar en producción los
    # flujos clave (lector PDF/EPUB, catálogo/portadas, noticias con sus imágenes,
    # fuentes, autocompletar dirección) y comprobar que la consola NO muestra avisos
    # "Refused to load…".
    # PASO 2 (más adelante, si no hubo avisos): cambiar el nombre de la cabecera a
    # "Content-Security-Policy" (quitar el sufijo -Report-Only) para que bloquee de verdad.
    #
    # Lista blanca (por qué cada cosa):
    #  - script 'self': el bundle es propio; no hay scripts inline ni JS externo.
    #  - style 'unsafe-inline': React usa estilos en línea (style={{…}}) por todas partes.
    #  - fonts.googleapis (style) + fonts.gstatic (font): tipografías Inter/Fraunces.
    #  - img https: + data: + blob:: portadas (Gutenberg/OpenLibrary) y fotos de noticias
    #    vienen de dominios muy variados; las imágenes no ejecutan código. El lector
    #    genera blobs; las vistas previas usan data:.
    #  - connect 'self': diccionario, direcciones, Open Library y Gutendex se consultan
    #    desde el backend (/api/…), no desde el navegador.
    #  - worker/media blob:: el lector EPUB/PDF y el reproductor usan workers y blobs.
    #  - Stripe está desactivado ahora; cuando se active, añadir js.stripe.com a script-src
    #    y frame-src, y api.stripe.com a connect-src.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # SPA: cualquier ruta no-archivo cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para assets con hash en el nombre.
    # OJO nginx: este location tiene add_header propio, así que NO hereda los de arriba;
    # repetimos el nosniff (importante para que el navegador trate bien los .js/.css).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API -> backend Node en :5001
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (portadas, audio, EPUB/PDF) -> backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
    }

    # Subidas grandes (multer admite hasta 500 MB para audio de podcasts)
    client_max_body_size 600m;
}
